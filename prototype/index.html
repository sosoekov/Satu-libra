<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Личный кабинет руководителя — прототип</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ОБОЛОЧКА КЛИЕНТА 1С 8.5 (раздел 2.4 ТЗ): статичная имитация, некликабельна, в 1С не переносится -->
  <div class="shell" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="ОболочкаКлиента">
    <div class="shell-top">
      <span class="shell-logo" data-shell-icon="logo" aria-hidden="true"></span>
      <!-- FT_11: вкладки окон клиента — «Начало» и открытые формы (карточка стажера по ссылке «Предмет»). Рисует платформа -->
      <div class="shell-tabs" id="shellTabs" role="tablist" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="ВкладкиОконКлиента"></div>
    </div>

    <div class="shell-main">
      <div class="shell-side shell-left" aria-hidden="true">
        <span class="shell-ico" data-shell-icon="sectionMain"></span>
        <span class="shell-ico" data-shell-icon="sectionStaff"></span>
        <span class="grow"></span>
        <span class="shell-ico" data-shell-icon="panel"></span>
      </div>

      <!-- Карточка формы «Личный кабинет руководителя» -->
      <div class="shell-form">
        <div class="window" id="window">

          <!-- Заголовок формы: в 1С рисует платформа -->
          <div class="window-head col gap-3">
            <div class="row window-head-row" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="ЗаголовокФормы">
              <!-- «←» — заглушка навигации платформы -->
              <span class="window-back" data-shell-icon="back" title="Назад" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="КнопкаНазадПлатформы"></span>
              <h1 class="window-title grow" aria-hidden="true">Личный кабинет руководителя</h1>
              <!-- Демо-переключатель этапа выбранного стажера: только для прототипа -->
              <div class="demo-dock" id="demoDock" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="ДемоПереключательЭтапа"></div>
              <div class="row window-tools">
                <span class="form-tool" data-shell-icon="refresh" aria-hidden="true"></span>
                <!-- FT_12: меню «Еще» окна — рисует платформа; в прототипе действует только «Изменить форму» -->
                <div class="menu-host form-menu-host" id="formMenuHost">
                  <button type="button" class="form-tool form-tool-btn" data-shell-icon="more" data-action="formMenuToggle" title="Еще" aria-haspopup="menu"
                          data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="КнопкаЕщеПлатформы"></button>
                  <div id="formMenu"></div>
                </div>
                <span class="form-tool" data-shell-icon="close" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Верхние вкладки -->
            <div class="tabs tabs-top" id="topTabs" data-1c="Страницы" data-1c-name="СтраницыРазделы"></div>
          </div>

          <div class="window-body" id="windowBody">
            <!-- Страница «Подбор персонала» (FT_15): счетчики и кнопки слева, «Заявки в работе» справа -->
            <div class="page-body rc-page hidden" id="recruitPage"
                 data-1c="ГруппаГоризонтальная" data-1c-name="ГруппаПодборПерсонала"></div>

            <!-- Страница «Задачи и уведомления» (FT_10): левая панель отборов и список задач / уведомлений текущего пользователя -->
            <div class="page-body hidden" id="tasksPage"
                 data-1c="ГруппаГоризонтальная" data-1c-name="ГруппаЗадачиИУведомления">
              <div class="zone-left" id="tasksLeft" data-1c="ГруппаВертикальная" data-1c-name="ГруппаЗадачиЛеваяПанель"></div>
              <div class="zone-center" id="tasksCenter" data-1c="ГруппаВертикальная" data-1c-name="ГруппаЗадачиЦентр"></div>
            </div>

            <!-- Страница «Адаптация персонала»: три зоны -->
            <div class="page-body" id="adaptationPage"
                 data-1c="ГруппаГоризонтальная" data-1c-name="ГруппаАдаптацияОсновная">
              <div class="zone-left" id="leftZone" data-1c="ГруппаВертикальная" data-1c-name="ГруппаЛеваяПанель" data-1c-risk="check"></div>
              <div class="zone-center" id="centerZone" data-1c="ГруппаВертикальная" data-1c-name="ГруппаЦентр"></div>
              <div class="zone-help hidden" id="helpZone" data-1c="ГруппаВертикальная" data-1c-name="ГруппаСправка"></div>
            </div>
          </div>
        </div>

        <!-- FT_11: форма «Адаптационная программа (ФИО)» — карточка стажера в отдельном окне клиента (вкладка рядом с «Начало») -->
        <div class="window hidden" id="docWindow" data-1c="ОтдельнаяФорма" data-1c-name="ФормаКарточкаСтажера">
          <div class="window-head col gap-3">
            <div class="row window-head-row" data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="ЗаголовокФормыКарточкиСтажера">
              <h1 class="window-title grow" id="docTitle"></h1>
              <div class="row window-tools">
                <span class="form-tool" data-shell-icon="refresh" aria-hidden="true"></span>
                <span class="form-tool" data-shell-icon="more" aria-hidden="true"></span>
                <button type="button" class="form-tool form-tool-btn" data-action="shellCloseActive" title="Закрыть" data-shell-icon="close"
                        data-1c="НЕ_ПЕРЕНОСИТЬ" data-1c-name="КнопкаЗакрытьОкноПлатформы"></button>
              </div>
            </div>
          </div>
          <div class="window-body">
            <div class="zone-center doc-center" id="docCenter" data-1c="ГруппаВертикальная" data-1c-name="ГруппаКарточкаСтажераОкно"></div>
          </div>
        </div>
      </div>

      <div class="shell-side shell-right" aria-hidden="true">
        <span class="shell-ico" data-shell-icon="search"></span>
        <span class="shell-ico" data-shell-icon="bell"></span>
        <span class="shell-ico" data-shell-icon="history"></span>
        <span class="shell-ico" data-shell-icon="star"></span>
        <span class="shell-sep"></span>
        <span class="shell-ico" data-shell-icon="functions"></span>
        <span class="grow"></span>
        <span class="shell-ico" data-shell-icon="account"></span>
      </div>
    </div>
  </div>

  <!-- Модальные окна (в 1С — отдельные формы с блокировкой окна владельца) -->
  <div id="dialogHost"></div>

  <!-- Угол экрана: оповещения пользователя -->
  <div class="overlay-corner">
    <div class="toasts" id="toasts"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
